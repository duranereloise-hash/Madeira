name: MadeiraTV
options:
  bundleIdPrefix: com.willfaust
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    ENABLE_STRICT_OBJC_MSGSEND: YES

targets:
  MadeiraTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      # Common engine sources (shared with iOS app) — sibling of this folder
      - path: ../Madeira
        buildPhase: sources
        excludes:
          - "MadeiraApp.swift"
          - "ContentView.swift"
          - "StikJITHelper.swift"
          - "Info.plist"
          - "Madeira.entitlements"
          - "Madeira-Bridging-Header.h"
          - "prefix-template.tar.gz"
      # tvOS app sources — this folder
      - path: .
        buildPhase: sources
        excludes:
          - "project.yml"
          - "Info.plist"
          - "MadeiraTV.entitlements"
          - "BUILDING.md"
          - "Vendors"
      # Resources
      - path: ../Madeira/aarch64-windows
        buildPhase: resources
      - path: ../Madeira/arm64ec-windows
        buildPhase: resources
      - path: ../Madeira/nls
        buildPhase: resources
      - path: ../Madeira/legal
        buildPhase: resources
      - path: ../Madeira/cacert.pem
        buildPhase: resources
      - path: ../Madeira/prefix-template.tar.gz
        buildPhase: resources
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: GameController.framework
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: libz.tbd
      - sdk: libc++.tbd
      - sdk: libsqlite3.tbd
      - framework: Vendors/StikJITTV.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willfaust.madeira-tv
        PRODUCT_NAME: MadeiraTV
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: MadeiraTV.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: "../Madeira/Madeira-Bridging-Header.h"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../Madeira"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - -force_load
          - "$(SRCROOT)/../Madeira/libgnutls.a"
          - -force_load
          - "$(SRCROOT)/../Madeira/libhogweed.a"
          - -force_load
          - "$(SRCROOT)/../Madeira/libnettle.a"
          - -force_load
          - "$(SRCROOT)/../Madeira/libgmp.a"
          - -force_load
          - "$(SRCROOT)/../libdxmt_unix.a"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../Madeira"

  MadeiraTVHelper:
    type: app-extension
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: ../MadeiraTVHelper
        buildPhase: sources
        excludes:
          - "Info.plist"
    dependencies:
      - sdk: Network.framework
      - framework: Vendors/StikJITTV.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willfaust.madeira-tv.helper
        PRODUCT_NAME: MadeiraTVHelper
        INFOPLIST_FILE: ../MadeiraTVHelper/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: "../Madeira/Madeira-Bridging-Header.h"