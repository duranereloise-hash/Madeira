name: Build MadeiraTV IPA

on:
  workflow_dispatch:
  push:
    tags: ['v*-tv']

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build MadeiraTV IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Fetch StikJITTV.xcframework
        run: |
          mkdir -p app/MadeiraTV/Vendors
          curl -sL -o /tmp/st.zip \
            https://github.com/duranereloise-hash/StikJIT/releases/download/v1.6.0/StikJITTV.xcframework.zip
          unzip -q /tmp/st.zip -d /tmp/st
          cp -R /tmp/st/StikJITTV.xcframework app/MadeiraTV/Vendors/

      - name: Generate Xcode project
        run: |
          cd app/MadeiraTV
          xcodegen generate --spec project.yml

      - name: xcodebuild MadeiraTV
        run: |
          xcodebuild -project app/MadeiraTV/MadeiraTV.xcodeproj \
            -scheme MadeiraTV \
            -destination 'generic/platform=tvOS' \
            -configuration Debug \
            -derivedDataPath build/DerivedData-tv \
            CODE_SIGNING_ALLOWED=NO \
            build > /tmp/xcbuild.log 2>&1 || tail -80 /tmp/xcbuild.log

      - name: Package IPA
        run: |
          APP=$(find build/DerivedData-tv -name "MadeiraTV.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "no .app - check xcbuild log"; exit 1; fi
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -ry ../MadeiraTV-tvos.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MadeiraTV-tvos.ipa
          path: build/MadeiraTV-tvos.ipa
          if-no-files-found: error