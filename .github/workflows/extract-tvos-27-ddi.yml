name: Extract tvOS 27 DDI from Xcode 27

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-ddi:
    name: Extract tvOS 27 DDI
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find tvOS 27 DDI in Xcode
        run: |
          XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          echo "Xcode: $XCODE"

          echo "=== /Library/Developer/DeveloperDiskImages ==="
          ls -la /Library/Developer/DeveloperDiskImages/ 2>/dev/null || echo "empty"

          echo "=== tvOS_DDI version ==="
          cat /Library/Developer/DeveloperDiskImages/tvOS_DDI/version.plist 2>/dev/null || echo "no version.plist"

          echo "=== tvOS_DDI Restore ==="
          ls /Library/Developer/DeveloperDiskImages/tvOS_DDI/Restore/ 2>/dev/null || echo "no restore"

          echo "=== ProductBuildVersion ==="
          grep ProductBuildVersion /Library/Developer/DeveloperDiskImages/tvOS_DDI/Restore/BuildManifest.plist 2>/dev/null || echo "no manifest"

      - name: Package DDI
        run: |
          mkdir -p tvos27-ddi
          cp -R /Library/Developer/DeveloperDiskImages/ tvos27-ddi/ 2>/dev/null || echo "no ddi"
          find tvos27-ddi -type f | head -50
          du -sh tvos27-ddi

      - name: Upload tvOS 27 DDI
        uses: actions/upload-artifact@v4
        with:
          name: tvOS27-DDI-from-Xcode27
          path: tvos27-ddi/
          if-no-files-found: warn