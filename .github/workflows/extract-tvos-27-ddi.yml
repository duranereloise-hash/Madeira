name: Extract tvOS 27 DDI via setup-xcode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-ddi:
    name: Extract tvOS 27 DDI
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0-beta.6'

      - name: Xcode version
        run: xcodebuild -version

      - name: Find tvOS 27 DDI
        run: |
          echo "=== tvOS_DGI version ==="
          cat /Library/Developer/DeveloperDiskImages/tvOS_DDI/version.plist 2>/dev/null || echo "no version.plist"
          echo "=== ProductBuildVersion ==="
          grep 'ProductBuildVersion' /Library/Developer/DeveloperDiskImages/tvOS_DDI/Restore/BuildManifest.plist 2>/dev/null || echo "no manifest"
          echo "=== Restore contents ==="
          find /Library/Developer/DeveloperDiskImages/tvOS_DDI -type f 2>/dev/null

      - name: Package and Upload
        run: |
          mkdir -p tvos27-ddi
          cp -R /Library/Developer/DeveloperDiskImages/tvOS_DDI/ tvos27-ddi/ 2>/dev/null || echo "no tvOS_DDI dir"
          du -sh tvos27-ddi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tvOS27-DDI
          path: tvos27-ddi/
          if-no-files-found: warn