name: Extract tvOS 27 DDI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-ddi:
    name: Extract tvOS 27 DDI
    runs-on: xcode-27-arm64
    timeout-minutes: 20

    steps:
      - name: Xcode version
        run: xcodebuild -version

      - name: Find tvOS 27 DDI
        run: |
          echo "=== tvOS DDI version ==="
          cat /Library/Developer/DeveloperDiskImages/tvOS_DDI/version.plist
          echo "=== ProductBuildVersion ==="
          grep 'ProductBuildVersion' /Library/Developer/DeveloperDiskImages/tvOS_DDI/Restore/BuildManifest.plist
          echo "=== Restore contents ==="
          ls /Library/Developer/DeveloperDiskImages/tvOS_DDI/Restore/

      - name: Package
        run: |
          mkdir -p tvos27-ddi
          cp -R /Library/Developer/DeveloperDiskImages/tvOS_DDI/ tvos27-ddi/
          du -sh tvos27-ddi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tvOS27-DDI
          path: tvos27-ddi/
          if-no-files-found: error