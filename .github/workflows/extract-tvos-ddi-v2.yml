name: Extract tvOS 27 DeveloperDiskImage v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-ddi:
    name: Extract tvOS 27 DDI
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: List all Xcode versions
        run: |
          ls -d /Applications/Xcode*.app
          echo "---"
          echo "Default Xcode: $(xcode-select -p)"

      - name: Search all Xcodes for tvOS 27 DDI
        run: |
          for XC in /Applications/Xcode_26*.app /Applications/Xcode_27*.app /Applications/Xcode_1[7-9]*.app; do
            [ -d "$XC" ] || continue
            echo "===== $XC ====="
            echo "--- DeviceSupport ---"
            find "$XC/Contents/Developer/Platforms/AppleTVOS.platform/DeviceSupport" -maxdepth 1 -type d 2>/dev/null | sort
            echo "--- DeveloperDiskImage files ---"
            find "$XC" -name "DeveloperDiskImage*" -type f 2>/dev/null
            echo "--- DDI directories ---"
            find "$XC" -type d -name "DeveloperDiskImages" 2>/dev/null
            echo "--- Personalized directories ---"
            find "$XC/Contents/Developer" -type d -name "*Personalized*" 2>/dev/null
            echo "--- CoreDevice ---"
            find "$XC/Contents/Developer" -path "*/CoreDevice/*" -type d 2>/dev/null | head -5
            echo ""
          done
          echo "=== /Library/Developer ==="
          ls -la /Library/Developer/DeveloperDiskImages/ 2>/dev/null || echo "empty"
          for d in /Library/Developer/DeveloperDiskImages/*/; do
            [ -d "$d" ] && echo "  $d" && ls "$d" 2>/dev/null
          done

      - name: Capture all DDIs from every Xcode
        run: |
          mkdir -p tvos27-ddi
          
          for XC in /Applications/Xcode*.app; do
            [ -d "$XC" ] || continue
            TAG=$(basename "$XC" .app)
            mkdir -p "tvos27-ddi/$TAG"
            
            # DeviceSupport (.dmg + .signature)
            find "$XC/Contents/Developer/Platforms/AppleTVOS.platform/DeviceSupport" \
              \( -name "*.dmg" -o -name "*.signature" \) -type f 2>/dev/null | while read f; do
                cp "$f" "tvos27-ddi/$TAG/" 2>/dev/null || true
            done
            
            # DeveloperDiskImage files anywhere
            find "$XC" -name "DeveloperDiskImage*" -type f 2>/dev/null | while read f; do
                cp "$f" "tvos27-ddi/$TAG/" 2>/dev/null || true
            done
            
            # DeveloperDiskImages directories
            find "$XC" -type d -name "DeveloperDiskImages" 2>/dev/null | while read d; do
                cp -R "$d/" "tvos27-ddi/${TAG}_DeveloperDiskImages/" 2>/dev/null || true
            done
            
            # Personalized directories
            find "$XC/Contents/Developer" -type d -name "*Personalized*" 2>/dev/null | while read d; do
                cp -R "$d/" "tvos27-ddi/${TAG}_$(basename "$d")/" 2>/dev/null || true
            done
            
            # Any dmg/trustcache/cryptex_info/root_hash in DDI paths
            find "$XC/Contents/Developer" \
              \( -name "*.dmg" -o -name "*.trustcache" -o -name "*.cryptex_info" -o -name "*.root_hash" \) \
              -path "*DDI*" -type f 2>/dev/null | while read f; do
                cp "$f" "tvos27-ddi/$TAG/" 2>/dev/null || true
            done
          done
          
          # /Library/Developer/DeveloperDiskImages
          cp -R /Library/Developer/DeveloperDiskImages/ tvos27-ddi/Library_DeveloperDiskImages/ 2>/dev/null || echo "no lib ddri"
          
          echo "=== RESULT ==="
          find tvos27-ddi -type f | sort
          echo "--- total size ---"
          du -sh tvos27-ddi

      - name: Upload tvOS DDI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvOS27-DDI-v2
          path: tvos27-ddi/
          if-no-files-found: warn